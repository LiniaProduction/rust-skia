<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>skia-safe — Graphite / WebGPU</title>
    <style>
      body {
        margin: 0;
        background: #14141a;
        color: #d8d8e0;
        font: 14px system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 16px;
      }
      #canvas {
        width: 960px;
        height: 540px;
        max-width: 100%;
        border-radius: 8px;
      }
      #status {
        min-height: 1.4em;
        font-variant-numeric: tabular-nums;
      }
      .bad { color: #ff8080; }
    </style>
  </head>
  <body>
    <h1>Graphite / WebGPU</h1>
    <canvas id="canvas" width="960" height="540"></canvas>
    <div id="status">starting…</div>
    <pre id="diag" style="font:11px ui-monospace,monospace;color:#8a8a99;max-width:960px;white-space:pre-wrap"></pre>
    <!-- Classic script, and first: module scripts are deferred, so this is the only
         way to hook the console before wasm starts printing. -->
    <script src="./collect-log.js"></script>
    <script src="./trace-webgpu.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
